name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./...

  matrix-build:
    name: Cross-Platform Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: dock-radar-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: dock-radar-linux-arm64
          - goos: darwin
            goarch: amd64
            binary_name: dock-radar-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: dock-radar-darwin-arm64
          - goos: windows
            goarch: amd64
            binary_name: dock-radar-windows-amd64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Standalone Zero-Dependency Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.binary_name }} .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 7
